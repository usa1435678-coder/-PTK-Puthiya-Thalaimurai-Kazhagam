services:
  - type: web
    name: ptk-digital-platform
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    # Persistent disk keeps the SQLite database, backups, uploads and the member
    # CSV across deploys and restarts. Data on this disk is never deleted by a
    # redeploy.
    disk:
      name: ptk-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/ptk.db
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: PERSISTENT_STORAGE_ROOT
        value: /var/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MEMBER_CSV_PATH
        value: /var/data/ptk-members.csv
      - key: SESSION_SECRET
        generateValue: true
      # Render generates a unique initial password. Read it from the service
      # Environment page; existing administrator accounts are not reset on deploy.
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
