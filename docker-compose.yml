version: '3.8'
services:
  ptk-platform:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET in .env before starting}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DB_PATH=/app/data/ptk.db
      - BACKUP_DIR=/app/data/backups
      - PERSISTENT_STORAGE_ROOT=/app/data
      - UPLOAD_DIR=/app/data/uploads
      - MEMBER_CSV_PATH=/app/data/ptk-members.csv
    volumes:
      - ./data:/app/data
    restart: unless-stopped
